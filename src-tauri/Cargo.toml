[workspace]
resolver = "2"
members = [
    "crates/rime-core",
    "crates/rime-suggest",
    "crates/rime-safety",
    "crates/rime-platform",
    "crates/rime-deploy",
    "crates/rime-ffi",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
tempfile = "3"
sha2 = "0.10"
tracing = "0.1"

# ───────────────────────── 应用本体 ─────────────────────────

[package]
name = "rimetools"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "跨平台 Rime 词库管理工具"

[lib]
name = "rimetools_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "rimetools"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# 生产构建：把 dist/ 前端资源嵌进二进制，脱离 Vite dev server
default = []
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-log = "2"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"

serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
log = "0.4"

rime-core = { path = "crates/rime-core" }
rime-suggest = { path = "crates/rime-suggest" }
rime-safety = { path = "crates/rime-safety" }
rime-platform = { path = "crates/rime-platform" }
rime-deploy = { path = "crates/rime-deploy" }
rime-ffi = { path = "crates/rime-ffi" }
[dev-dependencies]
tempfile = { workspace = true }
